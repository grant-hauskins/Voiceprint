# Start with the tested Realtime provider. Voices are selected before the first reply.
# instructions_extra: standing instructions (how to respond); speaks_for: full name of the person this agent represents.
# These are defaults only. The /ui setup panel adds, removes and edits agents per session and saves them under data\agents, which wins.
[[agents]]
name = "Ava"
provider = "openai_realtime"
model = "gpt-realtime-2.1"
voice = "marin"
eagerness = "balanced"
output_device = "HD 4.40,BenQ"
instructions_extra = ""

[[agents]]
name = "Ben"
provider = "openai_realtime"
model = "gpt-realtime-2.1"
voice = "cedar"
eagerness = "quiet"
output_device = "HD 4.40,BenQ"
instructions_extra = ""
